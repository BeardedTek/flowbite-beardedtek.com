{{/* Expects a dict with "title" and optional "text" (same pattern as contact header). */}}
<section>
  <div class="max-w-screen-xl px-4 py-6 mx-auto sm:py-12 lg:py-20 pt-20 sm:pt-24 lg:pt-32">
    <div class="max-w-2xl mx-auto text-center">
      <h1 class="text-3xl font-extrabold tracking-tight text-gray-900 sm:text-4xl dark:text-white">
        {{ .title }}
      </h1>
      {{ if .text }}
      <p class="mt-4 text-base text-gray-500 sm:text-xl dark:text-gray-500">
        {{ .text }}
      </p>
      {{ end }}
      {{ if .sheet }}
      <div class="mt-8 flex flex-wrap justify-center items-center gap-3 sm:gap-4">
        {{ with .sheet }}
        {{ if .pdf_rel }}
        <a href="{{ relURL .pdf_rel }}"
          class="inline-block text-primary-700 bg-white border border-primary-700 hover:bg-gray-50 focus:ring-4 focus:ring-primary-200 focus:outline-none font-medium rounded-lg text-sm px-5 py-2.5 text-center dark:bg-gray-800 dark:text-primary-400 dark:border-primary-500 dark:hover:bg-gray-700 dark:focus:ring-primary-900"
          target="_blank"
          rel="noopener noreferrer">
          {{- .button_text | default "Download PDF" -}}
        </a>
        {{ end }}
        {{ end }}
      </div>
      {{ end }}
    </div>
  </div>
</section>
